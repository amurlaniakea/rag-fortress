[project]
name = "rag-fortress"
version = "1.0.0-alpha"
description = "Framework profesional de defensa RAG (poisoning, MIA, anomaly detection con embeddings reales e IsolationForest)."
authors = [{name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com"}]
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "scikit-learn",
    "sentence-transformers",
    "transformers",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]
